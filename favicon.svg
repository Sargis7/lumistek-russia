<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lumistek">
  <title>Lumistek</title>
  <defs>
    <linearGradient id="favL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1cb0c6"/>
      <stop offset="1" stop-color="#1b75bc"/>
    </linearGradient>
  </defs>

  <!-- Тёмный скруглённый квадрат в цвет фона сайта (#0a0a0a) -->
